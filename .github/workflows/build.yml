# Builds ArtCoreSound.exe + Setup.exe on Windows; runs the tests on Linux (ffmpeg, offscreen Qt, no sound card).
# Every push / PR: artifacts on the run page (Actions → run → Artifacts).
# The long-film check (tools/stress_long.py, ~2.5 h 5.1) runs only by hand: Actions → Build → Run workflow →
# «stress» on; its report is in the run's artifacts and summary.
# Publishing a release (Releases → Draft a new release → tag 0.1.0 → Publish):
# the installer and a portable zip are built and attached to that release.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      stress:
        description: "Run the long-film check (tools/stress_long.py)"
        type: boolean
        default: true
      minutes:
        description: "Length of the test film, minutes"
        default: "150"
      dts:
        description: "Add a DTS track to the film"
        type: boolean
        default: true
      stress_os:
        description: "Runner for the long-film check"
        type: choice
        options: [windows-latest, ubuntu-latest]
        default: windows-latest

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: System packages (ffmpeg, PortAudio, Qt's xcb deps)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg libportaudio2 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libegl1
      - name: Python packages
        run: python -m pip install -r requirements.txt pytest
      - name: A small disk for the disk-full test (8 MB tmpfs)
        run: |
          sudo mkdir -p /mnt/small
          sudo mount -t tmpfs -o size=8m tmpfs /mnt/small
          sudo chmod 777 /mnt/small
      - name: Tests (offscreen Qt, real files made by ffmpeg, the null sound output)
        env:
          QT_QPA_PLATFORM: offscreen
          ARTCORE_AUDIO: "null"
          ARTCORE_SMALL_DISK: /mnt/small
        run: python -m pytest -q tests
      - name: Screenshots (dark and light)
        if: always()
        env:
          QT_QPA_PLATFORM: offscreen
          ARTCORE_AUDIO: "null"
        run: python tools/screenshots.py shots
      - name: Screenshots at 150 % (High DPI)
        if: always()
        env:
          QT_QPA_PLATFORM: offscreen
          ARTCORE_AUDIO: "null"
          QT_SCALE_FACTOR: "1.5"
        run: python tools/screenshots.py shots/150 ru --quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ github.sha }}
          path: |
            shots/*.png
            shots/150/*.png

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Check version matches the release tag
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}".TrimStart("v", "V")
          $code = (Select-String -Path sound/__init__.py -Pattern '^VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $iss = (Select-String -Path setup.iss -Pattern '#define AppVersion\s+"([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $code -or $tag -ne $iss) {
            Write-Error "Release tag $tag does not match the code version (sound/__init__.py: $code, setup.iss: $iss)."
            exit 1
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Download FFmpeg
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/fetch_ffmpeg.py

      - name: Smoke test from source (ffmpeg, PortAudio / WASAPI, editing, every save format)
        env:
          QT_QPA_PLATFORM: offscreen
          ARTCORE_FFMPEG_DIR: ffmpeg/bin
        shell: pwsh
        run: |
          python run.py --selftest
          $c = $LASTEXITCODE
          Get-Content "$env:TEMP\artcore_sound_selftest.txt"
          exit $c

      - name: Render icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/make_icon.py

      - name: PyInstaller
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name ArtCoreSound
          --icon assets/icon.ico
          --version-file version_info.txt
          --collect-data qtawesome
          --collect-all _sounddevice_data
          --hidden-import sounddevice
          --exclude-module PySide6.QtQml
          --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtQuickWidgets
          --exclude-module PySide6.QtQuick3D
          --exclude-module PySide6.QtQuickControls2
          --exclude-module PySide6.QtPdf
          --exclude-module PySide6.QtPdfWidgets
          --exclude-module PySide6.QtDataVisualization
          --exclude-module PySide6.QtCharts
          --exclude-module PySide6.QtGraphs
          --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtWebChannel
          --exclude-module PySide6.QtWebSockets
          --exclude-module PySide6.QtMultimedia
          --exclude-module PySide6.QtMultimediaWidgets
          --exclude-module PySide6.QtSql
          --exclude-module PySide6.QtTest
          --exclude-module PySide6.QtDesigner
          --exclude-module PySide6.QtHelp
          --exclude-module PySide6.QtBluetooth
          --exclude-module PySide6.QtPositioning
          --exclude-module PySide6.QtLocation
          --exclude-module PySide6.QtSensors
          --exclude-module PySide6.QtSerialPort
          --exclude-module PySide6.QtSvgWidgets
          --exclude-module PySide6.Qt3DCore
          --exclude-module PySide6.QtScxml
          --exclude-module PySide6.QtStateMachine
          --exclude-module PySide6.QtTextToSpeech
          --exclude-module PySide6.QtRemoteObjects
          --exclude-module PySide6.QtNfc
          --exclude-module PySide6.QtSpatialAudio
          --exclude-module PySide6.QtHttpServer
          --exclude-module PySide6.QtOpenGL
          --exclude-module PySide6.QtOpenGLWidgets
          run.py

      - name: Trim unused Qt parts, add FFmpeg
        shell: pwsh
        run: |
          python tools/trim_build.py dist/ArtCoreSound
          Copy-Item -Recurse ffmpeg dist/ArtCoreSound/ffmpeg

      - name: Self-test the built exe
        shell: pwsh
        run: |
          Remove-Item "$env:TEMP\artcore_sound_selftest.txt" -ErrorAction SilentlyContinue
          Remove-Item -Recurse "$env:TEMP\artcore_sound_selftest" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "dist\ArtCoreSound\ArtCoreSound.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP\artcore_sound_selftest.txt"
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed (exit $($p.ExitCode))"; exit 1 }
          $mb = [math]::Round(((Get-ChildItem dist\ArtCoreSound -Recurse | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "dist size: $mb MB"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
                  Where-Object { Test-Path $_ } | Select-Object -First 1
          & $iscc setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable zip
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/ArtCoreSound/LICENSE.txt
          Copy-Item THIRD-PARTY.md dist/ArtCoreSound/THIRD-PARTY.txt
          Set-Content dist/ArtCoreSound/portable.ini "[ArtCore]`r`n; delete this file to use %APPDATA%\ArtCoreSound"
          Compress-Archive -Path dist/ArtCoreSound -DestinationPath installer/ArtCoreSound-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ArtCoreSound-${{ github.sha }}
          path: installer/*

      - name: Attach to the published release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" installer/* --clobber --repo "${{ github.repository }}"

  stress:
    # by hand only (Run workflow → stress): a ~2.5 h 5.1 film opened, drawn, edited, analysed, processed and saved
    if: github.event_name == 'workflow_dispatch' && inputs.stress
    runs-on: ${{ inputs.stress_os || 'windows-latest' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg libportaudio2 libxcb-cursor0 libxkbcommon-x11-0 libegl1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Python packages
        run: python -m pip install -r requirements.txt psutil
      - name: Download FFmpeg (Windows)
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/fetch_ffmpeg.py
      - name: The long-film check
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          ARTCORE_AUDIO: "null"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: utf-8
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export ARTCORE_FFMPEG_DIR="$PWD/ffmpeg/bin"; fi
          # the working files on the runner's own temp disk (D: on Windows — C: there is far slower)
          export ARTCORE_SOUND_TEMP="${{ runner.temp }}/ArtCoreSound"
          mkdir -p stress
          set -o pipefail
          python tools/stress_long.py stress --minutes "${{ inputs.minutes }}" ${{ inputs.dts && '--dts' || '' }} 2>&1 | tee stress/log.txt
          cat stress/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: The report as a picture
        if: always()
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          ARTCORE_AUDIO: "null"
          PYTHONIOENCODING: utf-8
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export ARTCORE_FFMPEG_DIR="$PWD/ffmpeg/bin"; export PATH="$PWD/ffmpeg/bin:$PATH"; fi
          ARTCORE_STRESS_REPORT=stress/report.md python tools/screenshots.py stress/shots ru --quick || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-${{ github.sha }}
          path: |
            stress/report.md
            stress/report.json
            stress/log.txt
            stress/shots/stress_report_*.png
